name: Update README — latest posts

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a manual dispatch overlapping the scheduled run would
# race the final `git push` (non-fast-forward rejection). Queue, don't cancel —
# both runs' results are wanted.
concurrency:
  group: blog-posts
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # --require-hashes: the lockfile carries sha256 hashes (compiled from
        # scripts/requirements.in) — integrity-verified, not just pinned.
        run: pip install --require-hashes -r scripts/requirements.txt

      - name: Generate post cards and refresh README
        env:
          # GH_TOKEN: optional fine-grained PAT repo secret (falls back to the
          # auto-injected GITHUB_TOKEN). Used for the GitHub Activity card's
          # contribution-calendar GraphQL query.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain README.md assets)" ]]; then
            git add README.md assets
            git commit -m "chore: refresh latest post cards"
            git push
          else
            echo "No changes."
          fi
