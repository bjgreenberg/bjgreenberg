[mypy]
# Every Python file in the repo: scripts/generate_cards.py and its tests, all
# --strict, set by `files = .` rather than a list, so a new .py file anywhere is
# checked the day it lands. Only the virtualenvs (gitignored) are left out.
# Run with scripts/typecheck.sh (the same script locally and in CI), which also
# fails if mypy checked fewer files than the repo has.
files = .
exclude = (?x)^(venv|\.venv)/
# 3.12: the interpreter the daily blog-posts.yml bot and CI both run.
python_version = 3.12
strict = True
warn_unreachable = True
